name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: munchies-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: swift:6.4.3-noble
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      SWIFT_WASM_SDK: swift-6.4.3-RELEASE_wasm
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Swift engine
        run: swift test --only-use-versions-from-resolved-file
      - name: Install Swift WebAssembly SDK
        run: >-
          swift sdk install
          https://download.swift.org/swift-6.4.3-release/wasm-sdk/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE_wasm.artifactbundle.tar.gz
          --checksum 5f24408dc9737ce4cb23b7e3ed4306cabfa02cc02f22ab260b14579b955d4b12
      - name: Build Cloudflare Pages bundle
        run: ./build.sh
      - name: Install browser engines and system libraries
        run: |
          npx playwright install --with-deps webkit chromium
          apt-get install -y --no-install-recommends python3 xauth
      - name: Verify browser and offline play
        run: xvfb-run --auto-servernum npm run test:browser
