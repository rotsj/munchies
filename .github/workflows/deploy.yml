name: Verify and deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: munchies-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container: swift:6.4.3-noble
    timeout-minutes: 30
    environment:
      name: production
      url: https://munchies.pages.dev
    defaults:
      run:
        shell: bash
    env:
      SWIFT_WASM_SDK: swift-6.4.3-RELEASE_wasm
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Swift engine
        run: swift test --only-use-versions-from-resolved-file
      - name: Install Swift WebAssembly SDK
        run: >-
          swift sdk install
          https://download.swift.org/swift-6.4.3-release/wasm-sdk/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE_wasm.artifactbundle.tar.gz
          --checksum 5f24408dc9737ce4cb23b7e3ed4306cabfa02cc02f22ab260b14579b955d4b12
      - name: Build Cloudflare Pages bundle
        run: ./build.sh
      - name: Install browser engines and system libraries
        run: |
          npx playwright install --with-deps webkit chromium
          apt-get install -y --no-install-recommends python3 xauth
      - name: Verify the bundle that will be deployed
        run: xvfb-run --auto-servernum npm run test:browser
      - name: Install pinned Wrangler
        run: npm install --global --ignore-scripts wrangler@4.156.2
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=munchies --branch=main --commit-hash="$GITHUB_SHA"
      - name: Verify the production URL serves this release
        run: |
          origin=https://munchies.pages.dev
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "$origin/sw.js?release=$GITHUB_SHA" -o "$RUNNER_TEMP/munchies-sw.js" &&
               cmp -s dist/sw.js "$RUNNER_TEMP/munchies-sw.js"; then
              printf '### Cloudflare Pages production\n\n%s\n' "$origin" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The production URL is not serving the deployed Munchies release."
          exit 1
